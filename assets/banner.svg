<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050508"/>
      <stop offset="50%" stop-color="#0b0b14"/>
      <stop offset="100%" stop-color="#07070c"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <radialGradient id="glow1" cx="25%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="40%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.03"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" rx="24" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" rx="24" fill="url(#grid)"/>
  <rect width="1200" height="420" rx="24" fill="url(#glow1)"/>
  <rect width="1200" height="420" rx="24" fill="url(#glow2)"/>
  <rect x="1" y="1" width="1198" height="418" rx="23" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>

  <!-- Left Content -->
  <g transform="translate(72, 78)">
    <!-- Badge -->
    <rect x="0" y="0" width="335" height="32" rx="16" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-opacity="0.35" stroke-width="1"/>
    <circle cx="18" cy="16" r="4.5" fill="#fbbf24"/>
    <text x="32" y="20.5" fill="#fcd34d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">OPEN-SOURCE CLOUD DRIVE VFS</text>

    <!-- Title -->
    <text x="0" y="102" fill="url(#goldGrad)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="68" font-weight="900" letter-spacing="-1.5">WayDrive</text>
    <text x="322" y="102" fill="#f8fafc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="300" opacity="0.75">v2.0</text>

    <!-- Subtitle -->
    <text x="0" y="146" fill="#e2e8f0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="600">
      Turn Internet Archive S3 into a Modern Google Drive
    </text>
    <text x="0" y="178" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="400">
      Virtual File System (VFS) • Instant Rename &amp; Move • Smart Video Thumbnails • Zero Backend Server
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 214)">
      <rect x="0" y="0" width="168" height="38" rx="10" fill="#11111c" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="20" y="24" fill="#fbbf24" font-family="monospace" font-size="13" font-weight="700">⚡ IAS3 Official API</text>

      <rect x="182" y="0" width="184" height="38" rx="10" fill="#11111c" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="202" y="24" fill="#34d399" font-family="monospace" font-size="13" font-weight="700">🔥 Firebase / Local VFS</text>

      <rect x="380" y="0" width="185" height="38" rx="10" fill="#11111c" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="400" y="24" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="700">🎬 Live Video Previews</text>
    </g>
  </g>

  <!-- Right Graphic: Mini File Explorer UI Card -->
  <g transform="translate(720, 56)">
    <rect x="0" y="0" width="415" height="308" rx="18" fill="#0b0b12" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>
    <!-- Window Header -->
    <rect x="0" y="0" width="415" height="44" rx="18" fill="#11111c"/>
    <circle cx="22" cy="22" r="5.5" fill="#f43f5e"/>
    <circle cx="40" cy="22" r="5.5" fill="#f59e0b"/>
    <circle cx="58" cy="22" r="5.5" fill="#10b981"/>
    <text x="84" y="26.5" fill="#94a3b8" font-family="monospace" font-size="12" font-weight="600">/WayDrive/Reelz</text>
    <rect x="320" y="11" width="78" height="22" rx="6" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-opacity="0.35"/>
    <text x="333" y="25.5" fill="#fbbf24" font-family="monospace" font-size="10.5" font-weight="700">VFS ONLINE</text>

    <!-- Folder Row -->
    <g transform="translate(20, 62)">
      <rect x="0" y="0" width="180" height="52" rx="12" fill="#12121e" stroke="#f59e0b" stroke-opacity="0.3"/>
      <rect x="12" y="12" width="28" height="28" rx="7" fill="#f59e0b" fill-opacity="0.2"/>
      <text x="20" y="31" fill="#fbbf24" font-family="sans-serif" font-size="14">📁</text>
      <text x="50" y="25" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">Reelz Vault</text>
      <text x="50" y="40" fill="#64748b" font-family="monospace" font-size="10">38 videos • VFS</text>

      <rect x="195" y="0" width="180" height="52" rx="12" fill="#12121e" stroke="#ffffff" stroke-opacity="0.06"/>
      <rect x="207" y="12" width="28" height="28" rx="7" fill="#38bdf8" fill-opacity="0.15"/>
      <text x="215" y="31" fill="#38bdf8" font-family="sans-serif" font-size="14">📚</text>
      <text x="245" y="25" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">Study &amp; Books</text>
      <text x="245" y="40" fill="#64748b" font-family="monospace" font-size="10">14 files • S3</text>
    </g>

    <!-- Video Thumbnail Grid Preview -->
    <g transform="translate(20, 130)">
      <rect x="0" y="0" width="180" height="154" rx="14" fill="#12121e" stroke="#ffffff" stroke-opacity="0.07"/>
      <rect x="10" y="10" width="160" height="94" rx="9" fill="#1e1b4b"/>
      <circle cx="90" cy="57" r="18" fill="#f59e0b"/>
      <polygon points="86,49 86,65 99,57" fill="#09090f"/>
      <text x="14" y="124" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">🎬 Lana - West Coast.mp4</text>
      <text x="14" y="141" fill="#64748b" font-family="monospace" font-size="10">6.54 MB • MP4 • HD</text>

      <rect x="195" y="0" width="180" height="154" rx="14" fill="#12121e" stroke="#ffffff" stroke-opacity="0.07"/>
      <rect x="205" y="10" width="160" height="94" rx="9" fill="#0f172a"/>
      <circle cx="285" cy="57" r="18" fill="#f59e0b"/>
      <polygon points="281,49 281,65 294,57" fill="#09090f"/>
      <text x="209" y="124" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">Turkish 🌧️🇹🇷.mp4</text>
      <text x="209" y="141" fill="#64748b" font-family="monospace" font-size="10">13.65 MB • MPEG4</text>
    </g>
  </g>
</svg>
